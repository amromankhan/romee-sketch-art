<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Romee Sketch Art | Change Password</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">✏️ Romee Sketch Art</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="custom-order.html">Custom Order</a></li>
      <li><a href="#" onclick="doLogout()">Logout</a></li>
    </ul>
  </nav>
  <div class="auth-page">
    <div class="auth-box">
      <h2>Change Password</h2>
      <p class="sub">Update your account password</p>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="currentPass" placeholder="Enter current password"/>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="Enter new password"/>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPass" placeholder="Confirm new password"/>
      </div>
      <button class="btn-buy" onclick="changePassword()">Update Password</button>
      <div id="changePassMsg" style="margin-top:16px;"></div>
      <p style="color:#888; margin-top:20px; text-align:center; font-size:0.9rem;">
        <a href="dashboard.html" style="color:#fff;">← Back to Dashboard</a>
      </p>
    </div>
  </div>
  <footer class="footer">
    <p>© 2026 Romee Sketch Art | Roman Khan</p>
  </footer>
<script src="../js/main.js"></script>
</body>
</html>
